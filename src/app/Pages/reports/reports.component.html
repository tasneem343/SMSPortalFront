  <h2 class="text-center mt-4">Reports</h2>
<div class="main-content ">
  <table>
    <thead>
      <tr>
        <th>Action</th>
        <th>Performed By</th>
        <th>Timestamp</th>
        <th>Details</th>
      </tr>
    </thead>
    <tbody>
  @if (Logs.length === 0) {
    <tr>
      <td colspan="4" class="text-center">No Reports yet</td>
    </tr>
  }

     @for (log of Logs; track log.id) {
<tr>
  <td>{{log.action}}</td>
  <td>{{log.userName}}</td>
  <td>{{log.timestamp|date: 'dd MMMM yyyy - hh:mm a'}}</td>
  <td>{{log.details}}</td>
</tr>
     }
    </tbody>
  </table>
</div>
